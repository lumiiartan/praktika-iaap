<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f3a67" />
    <title>Praktika – IAAP Skënder Luarasi</title>
    <link rel="icon" type="image/jpeg" href="./assets/logo-school.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/print.css" />
    <script>
      try {
        if (localStorage.getItem("praktika-iaap-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
      // GitHub Pages SPA fallback via 404.html → /?/path
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search.slice(1).split("&").map(function (part) {
            return part.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -location.search.length) + decoded + location.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
